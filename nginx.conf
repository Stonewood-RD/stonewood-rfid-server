server {
    listen 80 default_server;
    server_name rfidendpoint.stonewood.private pruebalector.stonewood.local;

    root /var/www/stonewood-rfid-server/www;
    index index.php index.html;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /router.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass rfid-server:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/stonewood-rfid-server/www$fastcgi_script_name;
    }

    client_max_body_size 20M;
}
